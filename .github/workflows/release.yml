name: Release

on:
  push:
    tags: ['v*']

# Creating a release writes to the repository.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Never ship something the tests reject.
      - name: Test
        run: dotnet test DnDInitiative.slnx --configuration Release

      - name: Publish
        shell: pwsh
        run: |
          # The tag is "v0.1.0"; the version number is the part after the "v".
          $version = $env:GITHUB_REF_NAME.TrimStart('v')

          dotnet publish src/DnDInitiative.App/DnDInitiative.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -p:Version=$version `
            --output publish

          Compress-Archive -Path publish/* -DestinationPath "DnDInitiative-$($env:GITHUB_REF_NAME)-win-x64.zip"

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "DnDInitiative-$($env:GITHUB_REF_NAME)-win-x64.zip" --title $env:GITHUB_REF_NAME --generate-notes